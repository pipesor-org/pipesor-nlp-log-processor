name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q src tests tools
      - name: Build and validate worker image
        shell: bash
        run: |
          docker build \
            --provenance=false \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag pipesor-nlp-log-processor:quality .
          test "$(docker image inspect pipesor-nlp-log-processor:quality --format '{{.Config.User}}')" = "10001:10001"
          set +e
          docker run --rm pipesor-nlp-log-processor:quality >container-startup.log 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"event":"configuration_invalid"' container-startup.log
          docker run --rm --entrypoint python \
            pipesor-nlp-log-processor:quality -m pip freeze \
            | grep -v '^pipesor-nlp-log-processor==' \
            > runtime-requirements.txt
      - name: Validate graceful container termination
        shell: bash
        run: |
          container_id="$(docker run --detach --entrypoint python \
            pipesor-nlp-log-processor:quality -c \
            'import itertools, time; from threading import Event; from pipesor_nlp_log_processor.main import install_shutdown_handlers; stop = Event(); install_shutdown_handlers(stop); print("signal_handler_ready", flush=True); all(time.sleep(0.1) or not stop.is_set() for _ in itertools.count())')"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            docker logs "$container_id" 2>&1 | grep -q signal_handler_ready && break
            sleep 1
          done
          docker logs "$container_id" 2>&1 | grep -q signal_handler_ready
          docker stop --timeout 60 "$container_id"
          test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" -eq 0
          docker rm "$container_id"
          trap - EXIT
      - name: Generate SBOMs and scan runtime dependencies
        shell: bash
        run: |
          mkdir -p artifacts
          docker image inspect pipesor-nlp-log-processor:quality \
            --format '{{.Id}}' > artifacts/image-digest.txt
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --pkg-types os --scanners vuln --format cyclonedx \
            --output /work/artifacts/os-sbom.cdx.json \
            pipesor-nlp-log-processor:quality
          set +e
          python -m pip_audit --requirement runtime-requirements.txt \
            --format cyclonedx-json --output artifacts/python-sbom.cdx.json
          python_sbom_status=$?
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --pkg-types os --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --format json \
            --output /work/artifacts/os-vulnerabilities.json \
            pipesor-nlp-log-processor:quality
          os_scan_status=$?
          python -m pip_audit --requirement runtime-requirements.txt \
            --format json --output artifacts/python-vulnerabilities.json
          python_scan_status=$?
          set -e
          test "$python_sbom_status" -eq 0
          test "$os_scan_status" -eq 0
          test "$python_scan_status" -eq 0
      - name: Upload image assurance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nlp-image-assurance-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Export validated image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p image-artifact
          docker save --output image-artifact/worker-image.tar \
            pipesor-nlp-log-processor:quality
      - name: Upload validated image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: nlp-worker-image-${{ github.sha }}
          path: image-artifact/worker-image.tar
          if-no-files-found: error
          retention-days: 1
      - name: Validate pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python tools/validate_contribution.py --message-env PR_TITLE --pr-body-env PR_BODY
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git log --format=%s "$BASE_SHA..$HEAD_SHA" | python tools/validate_contribution.py --messages-stdin
      - name: Validate latest main commit
        if: github.event_name == 'push'
        env:
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: python tools/validate_contribution.py --message-env COMMIT_TITLE

  publish-private-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/pipesor-org/pipesor-nlp-log-processor
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Download validated image
        uses: actions/download-artifact@v8
        with:
          name: nlp-worker-image-${{ github.sha }}
          path: image-artifact
      - name: Load validated image
        run: docker load --input image-artifact/worker-image.tar
      - name: Guard existing package visibility
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GHCR_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/orgs/pipesor-org/packages/container/pipesor-nlp-log-processor)"
          case "$status" in
            200) test "$(jq --raw-output '.visibility' "$response_file")" = "private" ;;
            404) ;;
            *) cat "$response_file"; exit 1 ;;
          esac
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable commit tag
        shell: bash
        run: |
          docker tag pipesor-nlp-log-processor:quality "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          published_digest="$(docker image inspect "$IMAGE_NAME:$IMAGE_TAG" \
            --format '{{index .RepoDigests 0}}')"
          test -n "$published_digest"
          mkdir -p publication
          printf 'image=%s\ntag=%s\ndigest=%s\n' \
            "$IMAGE_NAME" "$IMAGE_TAG" "$published_digest" \
            > publication/published-image.txt
      - name: Verify private package visibility
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_visibility=""
          for _ in {1..10}; do
            package_visibility="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GHCR_TOKEN" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              https://api.github.com/orgs/pipesor-org/packages/container/pipesor-nlp-log-processor \
              | jq --raw-output '.visibility')" && break
            sleep 3
          done
          test "$package_visibility" = "private"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nlp-image-publication-${{ github.sha }}
          path: publication
          if-no-files-found: error
          retention-days: 30
