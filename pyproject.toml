[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pipesor-nlp-log-processor"
version = "0.1.0"
description = "Sanitized log preprocessing and Drain3 structuring for Pipesor."
requires-python = ">=3.14,<3.15"
dependencies = [
  "azure-identity==1.27.0",
  "azure-servicebus==7.15.0",
  "drain3==0.9.11",
]

[project.scripts]
pipesor-nlp-log-processor = "pipesor_nlp_log_processor.main:main"

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pytest==9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipesor_nlp_log_processor"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

